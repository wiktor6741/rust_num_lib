[package]
name = "rust_num_lib"
version = "0.1.0"
edition = "2024"
description = "Scientific computing library written in Rust: linear algebra and statistics"
license = "MIT"
authors = ["Wiktor Augustyn <wiktoraugustyn2005@gmail.com>"]
repository = "https://github.com/wiktor6741/rust_num_lib"
readme = "README.md"

[lib]
name = "rust_num_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", optional = true, features = ["abi3-py39"] }
rand = "0.8"
rayon = "1.12"

[features]
default = []
python = ["dep:pyo3"]

